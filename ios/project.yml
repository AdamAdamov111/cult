name: CULT
options:
  bundleIdPrefix: ru.byrain
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: NO

targets:
  CULT:
    type: application
    platform: iOS
    sources:
      - path: CULT/Sources
      - path: CULT/Resources/content.json
        buildPhase: resources
      - path: CULT/Resources/Images
        type: folder
        buildPhase: resources
      - path: CULT/Resources/Fonts
        buildPhase: resources
      - path: CULT/Resources/Configuration.storekit
        buildPhase: resources
      - path: CULT/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.byrain.cult
        INFOPLIST_KEY_CFBundleDisplayName: CULT
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CULT/Info.plist
      properties:
        CFBundleDisplayName: CULT
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        UIAppFonts:
          - Montserrat-Light.ttf
          - Montserrat-Regular.ttf
          - Montserrat-Medium.ttf
          - Montserrat-SemiBold.ttf
          - Montserrat-Bold.ttf

schemes:
  CULT:
    build:
      targets:
        CULT: all
    run:
      config: Debug
      storeKitConfiguration: CULT/Resources/Configuration.storekit
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
